# windows.yml 在 windows-latest runner 上验证 Windows 构建 + 测试 + traygui 托盘编译。
# 托盘（tray_fyne.go）、pidalive_windows、autostart_windows 仅 Windows 编译，本工作流守护其正确性；
# 托盘需 CGO + gcc（Fyne），用 MSYS2 mingw64 提供。其余 Go 代码路径无标签依赖，与 Linux/macOS 一致。
name: Windows 构建

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: 启用 mingw gcc（CGO 编译托盘所需）
        shell: pwsh
        run: |
          if (Test-Path C:\msys64\mingw64\bin\gcc.exe) {
            "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            choco install mingw -y --no-progress
          }
          gcc --version

      - name: go build + vet + test
        shell: bash
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: traygui 托盘 vet + 编译（CGO + Fyne）
        shell: bash
        run: |
          go vet -tags traygui ./...
          go build -tags traygui -ldflags="-s -w -H windowsgui" -o AutoSync.exe ./cmd/autosync
