# AutoSync 配置模板 —— 复制为 ~/.autosync/config.yaml 并按实际填写（可用 --config 覆盖路径）
# byproduct（日志/状态/锁）统一存放于 ~/.autosync/，不污染本配置与同步仓库。

# 同步目标文件夹（必填）
repo_dir: "D:\\MySyncFolder"

# 远程仓库地址，首次初始化时使用（必填）
remote_url: "git@github.com:yourname/your-repo.git"

# 远程名（默认 origin）
remote: "origin"

# 同步分支（默认 main）
branch: "main"

# 轮询间隔（默认 1m）
interval: "1m"

# 冲突策略：local_wins | remote_wins | conflict_files（默认 conflict_files）
#   local_wins     备份远程旧版本到分支 + --force-with-lease 推本地
#   remote_wins    放弃本地，重置到远程
#   conflict_files 本地版落 .sync-conflict-<时间戳>.ext 副本（入 git 同步），远程版生效
conflict_strategy: "conflict_files"

# backup 分支保留数，超出的旧备份自动清理（默认 10）
backup_keep: 10

# 网络操作重试次数（默认 3）
retry_count: 3

# 重试退避基数（默认 1s，按 1s/2s/4s 指数退避）
retry_base_delay: "1s"

# 单条 git 命令超时（默认 60s；大仓库/慢网络请调大，防挂起冻结同步）
git_timeout: "60s"

# 提交消息模板（默认 "auto sync: {{.Timestamp}}"）
commit_msg_format: "auto sync: {{.Timestamp}}"

# 是否输出到控制台（false = 仅文件，日志在 ~/.autosync/logs/autosync.log）
show_console: false

# 自动写入 repo_dir/.gitignore 的条目（仅追加，不覆盖已有）
ignore:
  - "*.tmp"
  - "Thumbs.db"
  - "desktop.ini"
  - ".DS_Store"
